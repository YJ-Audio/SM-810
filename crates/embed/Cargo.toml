[package]
name = "sampler-embed"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
sampler-decode.workspace = true
sampler-similarity.workspace = true
rustfft = "6.4.1"
tokenizers = { version = "0.23.2", default-features = false, features = ["onig"] }
ort = "=2.0.0-rc.13"
sha2 = "0.11"
ureq = "3"
tempfile.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
ort = { version = "=2.0.0-rc.13", features = ["coreml"] }

[target.'cfg(target_os = "windows")'.dependencies]
ort = { version = "=2.0.0-rc.13", features = ["directml"] }
