name: Check desktop
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Configure libclang on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV'
      - run: rustup show
      - run: rustup component add rustfmt clippy
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm prepare-layout
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: pnpm tauri build --debug --no-bundle
      - name: Build Windows installer
        if: runner.os == 'Windows'
        run: pnpm build:windows
      - name: Upload Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Sampler-windows-x64
          path: target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
